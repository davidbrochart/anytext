name: Test

on:
  pull_request:
    paths:
      - ".github/workflows/pythonpackage.yml"
      - "**.py"
      - "**.pyi"
      - "**.css"
      - "**.ambr"
      - "**.lock"
      - "pyproject.toml"
      - "Makefile"
  push:
    branches: [main, anytext]
    paths:
      - ".github/workflows/pythonpackage.yml"
      - "**.py"
      - "**.pyi"
      - "**.css"
      - "**.ambr"
      - "**.lock"
      - "pyproject.toml"
      - "Makefile"
  workflow_dispatch:

env:
  PYTEST_ADDOPTS: "--color=yes"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra syntax
      - name: Test with pytest
        run: |
          uv run --locked --extra syntax pytest tests -v --cov=./src/anytext --cov-report=xml:./coverage.xml --cov-report term-missing
      - name: Upload snapshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot_report_${{ matrix.os }}_py${{ matrix.python-version }}
          path: snapshot_report.html
          overwrite: true
