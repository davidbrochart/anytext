name: Ruff checks

on:
  pull_request:
    paths:
      - '.github/workflows/ruff.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '**.py'

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Check imports
        run: uv run --locked ruff check src
      - name: Check formatting
        run: uv run --locked ruff format --check src
