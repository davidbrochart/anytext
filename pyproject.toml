[project]
name = "anytext"
version = "9.1.0"
description = "Modern Text User Interface framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4"
authors = [
    { name = "Will McGugan", email = "will@textualize.io" },
    { name = "David Brochart", email = "david.brochart@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.11,<5",
    "sniffio>=1.3,<2",
    "markdown-it-py[linkify]>=2.1.0",
    "mdit-py-plugins",
    "rich>=14.2.0",
    "typing-extensions>=4.4.0,<5.0.0",
    "platformdirs>=3.6.0,<5",
    "pygments>=2.19.2,<3.0.0",
]

[project.urls]
Documentation = "https://textual.textualize.io/"

[project.optional-dependencies]
syntax = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-markdown>=0.3.0",
    "tree-sitter-json>=0.24.0",
    "tree-sitter-toml>=0.6.0",
    "tree-sitter-yaml>=0.6.0",
    "tree-sitter-html>=0.23.0",
    "tree-sitter-css>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-regex>=0.24.0",
    "tree-sitter-xml>=0.7.0",
    "tree-sitter-sql>=0.3.11",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-bash>=0.23.0",
]

[dependency-groups]
dev = [
    "uv_build>=0.13.5,<0.14",
    "griffe==0.32.3",
    "httpx>=0.23.1,<0.24.0",
    "mkdocs>=1.3.0,<2.0.0",
    "mkdocs-exclude>=1.0.2,<2.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.5,<2.0.0",
    "mkdocs-material>=9.0.11,<10.0.0",
    "mkdocs-rss-plugin>=1.5.0,<2.0.0",
    "mkdocstrings[python]>=0.20.0,<0.21.0",
    "mkdocstrings-python>=1.0.0,<2.0.0",
    "pre-commit>=2.13.0,<3.0.0",
    "pytest>=8.3.1,<9.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "trio>=0.26",
    "pytest-cov>=5.0.0,<6.0.0",
    "textual-dev>=1.7.0,<2.0.0",
    "types-setuptools>=67.2.0.1,<68.0.0.0",
    "pytest-textual-snapshot>=1.0.0,<2.0.0",
    "ruff==0.17.4",
    "zuban>=0.10.2",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "syntax: marks tests that require syntax highlighting (deselect with '-m \"not syntax\"')",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/examples/**", "tests/**", "docs-offline/**"]
source-exclude = [
    "/tests/snapshot_tests/__snapshots__",
    "/tests/browser/node_modules",
    "/tests/browser/test-results",
]
